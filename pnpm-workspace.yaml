packages:
  - apps/*
  - packages/*

# Sass's file watcher: its native build is only for `sass --watch`, never run here.
allowBuilds:
  '@parcel/watcher': false

# Fail the install when a dependency declares an engine this machine cannot
# satisfy. It says nothing about the root project's own "engines": pnpm 12
# dropped that check. What still guards pnpm is the "packageManager" pin.
engineStrict: true

# A release younger than a day is not installed: most hijacked npm versions
# are pulled within hours. Pin the previous version when a fresh one is needed.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@adrienlcp/*'

publicHoistPattern:
  - '@biomejs/*'

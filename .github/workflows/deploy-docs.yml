name: Deploy docs

# The site is rebuilt only when what it shows changes: its own code, a
# package's documentation or sources, a changelog the Version PR wrote, or a
# changeset waiting for the next release. Publishing to npm is release.yml's.
on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - packages/*/*.md
      - packages/*/package.json
      - packages/*/src/**
      - .changeset/*.md
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # The release dates are read from the history of each changelog.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # The site imports the packages through their built output.
      - name: Build
        run: pnpm build

      # Deploys are not queued in a concurrency group: GitHub cancels, and mails,
      # a run left waiting there. An older commit skips its deploy instead.
      - name: Check this commit is still the head of main
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "is-head=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.head.outputs.is-head == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler@4 pages deploy apps/docs/dist --project-name adrienlcp-packages --branch main

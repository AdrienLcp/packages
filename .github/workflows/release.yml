name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# `id-token` lets npm trusted publishing verify this workflow: no npm token is
# stored anywhere, and every version is published with provenance.
permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Releases are not queued in a concurrency group: GitHub cancels, and mails,
      # a run left waiting there. An older commit skips its release instead.
      - name: Check this commit is still the head of main
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "is-head=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A package's first version is published by hand: npm only lets a package
      # that already exists trust this workflow.
      - if: steps.head.outputs.is-head == 'true'
        run: node scripts/hold-back-unpublished-packages.mjs

      # Opens a "Version packages" pull request while changesets are pending,
      # and publishes once that pull request is merged.
      - uses: changesets/action@v1
        if: steps.head.outputs.is-head == 'true'
        with:
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

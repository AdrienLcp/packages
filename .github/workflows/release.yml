name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# `id-token` lets npm trusted publishing verify this workflow: no npm token is
# stored anywhere, and every version is published with provenance.
permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A package's first version is published by hand: npm only lets a package
      # that already exists trust this workflow.
      - run: node scripts/hold-back-unpublished-packages.mjs

      # Opens a "Version packages" pull request while changesets are pending,
      # and publishes once that pull request is merged.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

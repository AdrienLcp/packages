name: CI

# No `pull_request` trigger: the only pull request here is the Version PR the
# Release workflow opens, and a run on a bot's branch waits for an approval that
# never comes, mailing a failure each time. Its content is checked on `main`
# once merged.
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is `biome check --write`: it repairs the drift and exits 0,
      # so running it here would pass on exactly the code CI exists to reject.
      - name: Lint
        run: pnpm lint:ci

      - name: Spell
        run: pnpm spell

      # A package importing a sibling resolves it through the sibling's dist,
      # so everything after this reads the built output.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Fails under the thresholds in vitest.config.ts: a published package
      # must not lose its tests silently.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        run: |
          node -p "'Line coverage: ' + require('./coverage/coverage-summary.json').total.lines.pct + '%'" >> "$GITHUB_STEP_SUMMARY"

  # Workflows break at run time: a typo in an expression or a context passes
  # as plain YAML and only fails when the step is reached.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
